# Default model configuration — Phase 2 (Hiera backbone)
_target_: models.video_mamba.VideoMambaSystem

# ── Backbone ─────────────────────────────────────────────────────────────────
# facebook/hiera-base-plus-224 (MAE, ImageNet-1K) replaces DINOv2 ViT-B/14.
# Stage dims: Stage1=96 Stage2=192 Stage3=384 Stage4=768.
# dim_in drives all downstream modules (SSM, MemoryBank, ClassHead, etc.).
dim_in: 384        # Stage 3 primary dim (was 768 with DINOv2 ViT-B/14)
dim_out: 256
# Classification head output classes (e.g. HMDB51 = 51)
num_clf_classes: 51
# Segmentation head output channels = background + n_id objects (default n_id=10 → 11)
num_seg_classes: 11
num_boxes: 10
target_size: 224
learning_rate: 1e-4
# Weight for BCE in hybrid VOS loss (1 - vos_loss_beta = SoftDice weight)
vos_loss_beta: 0.5
fusion_mode: 'kan_spatial'
# Modulator type for IntricateKANSSMCore B/C matrices:
# 'kan'  → FastKAN Gaussian RBF (production default)
# 'mlp'  → two-layer MLP (ablation baseline)
modulator_type: 'kan'

# ── Memory-Attention Propagation ────────────────────────────────────────
# Key/value projection dimension for cross-frame attention matching
prop_d_key: 256
prop_d_value: 256
# Number of attention heads in PropagationAttention
prop_n_heads: 8
prop_dropout: 0.1
# Maximum stored frames in the memory bank (reference + N past frames)
max_mem_frames: 5
# Add current frame to memory every N query frames (1 = every frame)
memory_update_freq: 1
# Scheduled sampling for memory updates:
# 0.0 = always use GT mask (teacher forcing), 1.0 = always use prediction
scheduled_sampling_rate: 0.0
# Phase 2: dual-scale memory keys (Stage 3 semantic + Stage 2 fine-grained).
# Ablation: set prop_use_dual_scale=false to isolate the benefit of Stage 2 keys.
prop_use_dual_scale: true
