# Default model configuration
_target_: models.video_mamba.VideoMambaSystem

dim_in: 768
dim_out: 256
# Classification head output classes (e.g. HMDB51 = 51)
num_clf_classes: 51
# Segmentation head output channels = background + n_id objects (default n_id=10 → 11)
num_seg_classes: 11
num_boxes: 10
target_size: 224
learning_rate: 1e-4
# Weight for BCE in hybrid VOS loss (1 - vos_loss_beta = SoftDice weight)
vos_loss_beta: 0.5
fusion_mode: 'kan_spatial'
# Modulator type for IntricateKANSSMCore B/C matrices:
# 'kan'  → FastKAN Gaussian RBF (production default)
# 'mlp'  → two-layer MLP (ablation baseline)
modulator_type: 'kan'
# Propagation mode for recurrent mask feedback
# Options: 'soft_mask', 'direct_feature', 'teacher_forcing'
propagation_mode: 'soft_mask'
# Scheduled sampling rate: 0.0=always use GT, 1.0=always use prediction
scheduled_sampling_rate: 0.0
# Encoder fine-tuning: 0.0=fully frozen (default), e.g. 0.1 unfreezes backbone at 1/10th base LR
encoder_lr_scale: 0.0
# LR scheduler: 'none', 'cosine', 'cosine_warmup'
lr_scheduler: 'cosine_warmup'
# Gradient checkpointing: reduces activation memory ~60% at cost of ~20% slower backward
use_checkpointing: false
