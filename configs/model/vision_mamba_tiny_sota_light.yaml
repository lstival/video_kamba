# Light (<5M) SOTA-oriented preset for YouTube-VOS fine-tuning.
# Goal: improve propagation stability without large parameter growth.
_target_: models.video_mamba.VideoMambaSystem

# Encoder
encoder_type: vision_mamba_tiny
dim_in: 192
dim_out: 256

# Multi-scale dims from encoder
dim_in_fine: 96
dim_in_s2: 64
dim_in_s1: 48

# Vision-Mamba tiny internals
vim_stem_dim: 24
vim_stage0_dim: 48
vim_stage1_dim: 64
vim_stage2_dim: 96
vim_spatial_d_state: 8
vim_spatial_layers: 1

# Decoder widths
dec_dim_up1: 160
dec_dim_up2: 96
dec_dim_up3: 48

# Task heads
num_clf_classes: 51
num_seg_classes: 11
num_boxes: 10

# Resolution + optimization
target_size: 480
learning_rate: 4e-5
vos_loss_beta: 0.5

# KAN-guided fusion and temporal model
fusion_mode: kan_spatial
modulator_type: kan
ssm_d_state: 16
ssm_layers: 2
use_checkpointing: false
use_ref_context: true
consistency_weight: 0.0

# Propagation settings
prop_d_key: 192
prop_d_value: 192
prop_n_heads: 6
prop_dropout: 0.1
max_mem_frames: 7
memory_update_freq: 1
prop_use_dual_scale: true

# Scheduled sampling curriculum (new in VideoMambaSystem)
scheduled_sampling_rate: 0.25
scheduled_sampling_start: 0.0
scheduled_sampling_end: 0.25
scheduled_sampling_warmup_epochs: 5

# LR warmup before cosine decay (set >0 for fine-tuning from pretrained ckpt)
lr_warmup_epochs: 0
lr_warmup_start_factor: 0.1

# Scheduler helper
max_epochs: 50
