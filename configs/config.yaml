defaults:
  - _self_
  - datamodule: default
  - model: default
  - trainer: default
  - callbacks: default
  - logger: comet

# Global seeds
seed: 42

# Auto Batch Size tuning flag
auto_batch_size: false

# Work directory path (inferred at runtime or set)
work_dir: ${hydra:runtime.cwd}

# Output directory for hydra logs
hydra:
  run:
    dir: logs/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: logs/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
