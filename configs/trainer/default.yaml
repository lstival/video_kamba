# Default PyTorch Lightning Trainer config

_target_: lightning.Trainer

default_root_dir: ${work_dir}

min_epochs: 1
max_epochs: 100

accelerator: gpu
devices: 1
precision: 16-mixed

deterministic: true
fast_dev_run: false

# Clip gradient norm to prevent explosions in the T=16 sequential propagation loop.
# Without this, SSM hidden-state gradients accumulate across frames and cause
# loss spikes that prevent convergence.
gradient_clip_val: 1.0
gradient_clip_algorithm: norm
