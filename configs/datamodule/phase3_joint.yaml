# Joint DAVIS + YouTube-VOS + LVOS datamodule — Phase 3 generalist training.
#
# Sampling ratios (normalised automatically inside VOSDataModule):
#   DAVIS       15 % — short clips (≤90 frames), clean annotations
#   YouTube-VOS 60 % — large diversity (3.4k seqs), sparse annotations
#   LVOS        25 % — long-range (avg 408 frames), DTSM stress-test
#
# The WeightedRandomSampler ensures these ratios are respected regardless of
# raw dataset sizes (DAVIS: ~240 clips, YTB: ~220k clips, LVOS: ~47k clips).
#
# Clip length 6 / max_gap 3 for DAVIS+YTB.  clip_len=6 is the minimum needed
# for the DTSM slow SSM (A_bar≈0.995, log_A_init=-3.0) to receive non-vanishing
# gradients through BPTT — clip_len=4 caused A_modulator KAN to go dead in
# epoch 1 (60/60 vanishing steps) because the 4-step BPTT horizon gave
# essentially zero dL/d(log_A).  LVOS uses max_gap=5 to expose the slow SSM
# path to slightly longer temporal spans within each clip.
#
# _joint_vos_collate is selected automatically when lvos_root is set —
# all batches are emitted as 6-element (ref, ref_mask, q_imgs, q_masks,
# obj_present, meta) and routed through VideoMambaSystem._vos_step.
_target_: data.vos_datamodule.VOSDataModule

davis_root: ${work_dir}/data/DAVIS/DAVIS
ytv_root:   ${work_dir}/data/YouTubeVOS
lvos_root:  ${work_dir}/data/LVOS

# ── Sampling ratios ────────────────────────────────────────────────────────
davis_sampling_ratio: 0.15
lvos_sampling_ratio:  0.25
# BL30K not included in Phase 3 — already pre-trained on it.
bl30k_root: null
bl30k_sampling_ratio: 0.0

# ── Clip / augmentation ────────────────────────────────────────────────────
batch_size:   4
clip_len:     6
output_size:  480
max_gap:      3          # DAVIS + YTB stride
num_workers:  8
resolution:   480p
val_output_size: 480

# LVOS-specific clip sampling (larger gap for long-range context)
lvos_max_gap: 5
lvos_n_id:    10         # must match model num_seg_classes - 1

# Cap val sequences so the SSM hidden state stays within the training horizon.
# 24 = 4 × clip_len, giving enough context for the slow path to accumulate state.
max_val_frames: 24

# ── Train-time augmentation ────────────────────────────────────────────────
train_min_scale: 0.7
train_max_scale: 1.3
train_flip_prob: 0.5
train_color_jitter_prob: 0.8
