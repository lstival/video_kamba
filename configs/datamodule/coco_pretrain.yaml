# COCO 2017 pre-training datamodule configuration (real instance masks)
# Usage: python train.py datamodule=coco_pretrain
#
# This setup uses official COCO instance annotations (polygon/RLE -> masks)
# instead of rectangular bbox-filled masks.
_target_: data.coco_pretrain.COCOPretrainDataModule

# Spatial resolution — 448 matches the DINOv2 ViT-B/14 native patch grid
img_size: 448

# COCO local root expected to contain:
#   annotations/instances_train2017.json
#   annotations/instances_val2017.json
#   train2017/*.jpg
#   val2017/*.jpg
data_dir: ${work_dir}/data/coco

# Number of augmented query frames per COCO image clip
seq_len: 3

# Identity bank size (must match model.num_seg_classes - 1)
n_id: 10

# Larger batch than video — static images need less memory
batch_size: 4
num_workers: 8

# Kept for backward compatibility; ignored in local COCO mode
cache_dir: null

# Kept for backward compatibility; ignored in local COCO mode
streaming: false

# Set to a small integer (e.g. 500) to run a smoke-test job (null = use all ~118k)
max_samples: null
