# BL30K synthetic VOS pre-training datamodule configuration
# Usage: python train.py datamodule=bl30k
#
# BL30K contains ~30K synthetic video sequences
_target_: data.bl30k_pretrain.BL30KPretrainDataModule

# Spatial resolution — 448 matches the DINOv2 ViT-B/14 native patch grid
output_size: 448

# Expected data layout: data/BL30K/BL30K_part1/, etc.
data_dir: ${work_dir}/data/BL30K

# Clip length increased from 6 → 12 to give the DTSM slow SSM path enough
# temporal context for gradients to flow through meaningful long-range spans.
# At clip_len=6 the slow and fast SSMs see identical horizons — no learning
# signal differentiates the two timescales.
clip_len: 12
max_gap: 5

# Training schedule
batch_size: 2  # Video clips need more VRAM than static COCO images
num_workers: 8
val_fraction: 0.05
