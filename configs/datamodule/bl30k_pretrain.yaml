_target_: data.vos_datamodule.VOSDataModule

# BL30K: ~30K synthetic video sequences
# This config uses the integrated VOSDataModule with BL30K as the primary source.

davis_root: ${work_dir}/data/DAVIS
bl30k_root: ${work_dir}/data/BL30K
ytv_root: null

davis_sampling_ratio: 0.1     # We still keep a little DAVIS for diversity
bl30k_sampling_ratio: 0.9     # Focus on BL30K pre-training

output_size: 448              # Professional resolution
clip_len: 4
max_gap: 3
num_workers: 8
batch_size: 4

# Augmentation (same as COCO pretrain)
train_min_scale: 0.7
train_max_scale: 1.3
train_flip_prob: 0.5
train_color_jitter_prob: 0.8
