_target_: data.bl30k_pretrain.BL30KPretrainDataModule

# BL30K: ~30K synthetic video sequences, rendered objects on complex backgrounds.
# Per-frame pixel-accurate binary masks (one object per sequence).
# Used by TrickVOS, WarpFormer-S, AOTT as standard lightweight VOS pre-training.
#
# Expected data layout:
#   data/BL30K/
#     BL30K_part1/          # ~15K sequences
#       <seq_id>/
#         <frame_idx>.jpg
#         <frame_idx>.png   # binary mask
#     BL30K_part2/          # ~15K sequences
#       <seq_id>/
#         ...
#
# Download: https://henghuiding.github.io/MIVOS/ (BL30K section)

data_dir: ${work_dir}/data/BL30K
output_size: 480              # resize shorter side to 480, then random crop
clip_len: 6                   # 1 reference + 5 query frames per clip
max_gap: 5                    # max frame stride within a clip
num_workers: 8
batch_size: 8

# Augmentation (same as COCO pretrain)
train_min_scale: 0.7
train_max_scale: 1.3
train_flip_prob: 0.5
train_color_jitter_prob: 0.8
