# @package _global_
#
# Phase 3 — Joint YouTube-VOS + DAVIS Fine-tuning (MobileNetV2 + KAN-SSM Temporal)
#
# Initialise from Phase 2 checkpoint (best_mv2_phase2_davis.ckpt).
# Starting from Phase 2 (not Phase 1) is critical — PropagationAttention and
# KangaSSM have already adapted to real VOS on DAVIS before seeing the larger
# and more diverse YouTube-VOS distribution.
#
# Scheduled sampling ramp 0.1 → 0.5 over 50 epochs (λ* = 0.5):
#   - Begins at 0.1 (not 0.0) because Phase 2 already established partial robustness
#   - Asymptotes at 0.5 per the bias-variance optimum:
#     argmin_λ [ Bias(λ) + Var(λ) ] ≈ 0.5  (equal weight, α=1)
#   - Using λ > 0.5 increases error accumulation faster than it reduces exposure bias
#
# Target: val_J_and_F > 0.65 at epoch 50
# Reference: MobileVOS (CVPR 2023) ≈ 0.78 J&F with MobileNetV2 + Transformer
#
defaults:
  - override /callbacks: cv_gradient_tracking

model:
  learning_rate: 3.0e-5
  mv2_freeze_at: 2              # keep stages 0+1 frozen — same as Phase 2
                                # use_checkpointing only covers KangaSSM, not MobileNetV2;
                                # unfreezing the full backbone stores activations for 18 layers
                                # and OOMs before backward even runs (jobs 65764336, 65766138).
                                # The temporal/memory/decoder modules are what generalise to
                                # YouTube-VOS scale — the backbone does not need to change here.
  optimizer_weight_decay: 0.05
  use_checkpointing: true
  lr_warmup_epochs: 3
  lr_warmup_start_factor: 0.1

  # Full scheduled sampling curriculum to λ*=0.5
  scheduled_sampling_start: 0.1
  scheduled_sampling_end: 0.5
  scheduled_sampling_warmup_epochs: 5

  opt:
    optimizer:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 3.0e-5
      betas: [0.9, 0.95]
      eps: 1.0e-8
      weight_decay: 0.05

    lr_scheduler:
      _target_: torch.optim.lr_scheduler.OneCycleLR
      _partial_: true
      max_lr: 3.0e-5
      pct_start: 0.1
      anneal_strategy: cos
      div_factor: 10.0
      final_div_factor: 100.0

trainer:
  max_epochs: 50
  limit_train_batches: 3500
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  precision: "bf16-mixed"       # Phase 2 was stable in bf16; keep consistent
  accumulate_grad_batches: 2    # batch=4 × accum=2 → effective batch=8

callbacks:
  model_checkpoint:
    monitor: val_J_and_F
    mode: max
    filename: "best_mv2_phase3_ytbdav"
    save_top_k: 2               # keep top-2: epoch 50 may overfit, keep earlier peak

  layer_gradient_norm_tracker:
    log_every_n_steps: 50
    exploding_threshold: 1.0e+03
    vanishing_threshold: 1.0e-07
    patience: 50
    track_layer_names:
      - "propagation_attention.proj_out"
      - "temporal_model"
      - "feature_extractor"
