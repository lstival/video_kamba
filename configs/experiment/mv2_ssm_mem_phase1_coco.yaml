# @package _global_
#
# Phase 1 — COCO Pre-training (MobileNetV2 + KAN-SSM Temporal)
# MemoryStateBank + FeatureFusion architecture
defaults:
  - override /callbacks: default
  - override /model: mv2_ssm_memory

datamodule:
  batch_size: 8

model:
  learning_rate: 1.0e-4
  mv2_freeze_at: 2
  optimizer_weight_decay: 0.05
  use_checkpointing: true

  opt:
    optimizer:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 1.0e-4
      betas: [0.9, 0.95]
      eps: 1.0e-8
      weight_decay: 0.05

    lr_scheduler:
      _target_: torch.optim.lr_scheduler.OneCycleLR
      _partial_: true
      max_lr: 1.0e-4
      pct_start: 0.1
      anneal_strategy: cos
      div_factor: 10.0
      final_div_factor: 100.0

trainer:
  max_epochs: 20
  limit_train_batches: 3000
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  precision: "16-mixed"
  accumulate_grad_batches: 1

callbacks:
  model_checkpoint:
    monitor: val_loss
    mode: min
    filename: "best_mv2_ssmmem_phase1_coco"
    save_top_k: 1
