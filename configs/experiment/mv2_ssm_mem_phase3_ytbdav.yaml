# @package _global_
#
# Phase 3 — Joint YouTube-VOS + DAVIS Fine-tuning (MobileNetV2 + KAN-SSM Temporal)
# MemoryStateBank + FeatureFusion architecture
defaults:
  - override /callbacks: cv_gradient_tracking
  - override /model: mv2_ssm_memory

model:
  learning_rate: 3.0e-5
  mv2_freeze_at: 2
  optimizer_weight_decay: 0.05
  use_checkpointing: true
  lr_warmup_epochs: 3
  lr_warmup_start_factor: 0.1

  scheduled_sampling_start: 0.1
  scheduled_sampling_end: 0.5
  scheduled_sampling_warmup_epochs: 5

  opt:
    optimizer:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 3.0e-5
      betas: [0.9, 0.95]
      eps: 1.0e-8
      weight_decay: 0.05

    lr_scheduler:
      _target_: torch.optim.lr_scheduler.OneCycleLR
      _partial_: true
      max_lr: 3.0e-5
      pct_start: 0.1
      anneal_strategy: cos
      div_factor: 10.0
      final_div_factor: 100.0

trainer:
  max_epochs: 50
  limit_train_batches: 3500
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  precision: "bf16-mixed"
  accumulate_grad_batches: 2

callbacks:
  model_checkpoint:
    monitor: val_J_and_F
    mode: max
    filename: "best_mv2_ssmmem_phase3_ytbdav"
    save_top_k: 2

  layer_gradient_norm_tracker:
    log_every_n_steps: 50
    exploding_threshold: 1.0e+03
    vanishing_threshold: 1.0e-07
    patience: 50
    track_layer_names:
      - "feature_fusion"
      - "temporal_model_local"
      - "temporal_model_global"
      - "feature_extractor"
      - "ssm_output_fusion"
